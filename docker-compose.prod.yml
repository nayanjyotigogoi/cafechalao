# Production website for https://tohfaah.com. Runs on 127.0.0.1:3000; the Caddy proxy from the
# backend repository (CC-BEND) gives it HTTPS. Start the backend first, then:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_MODE: http
        NEXT_PUBLIC_API_URL: https://tohfaah.online
        NEXT_PUBLIC_DEFAULT_TENANT: cafe-1bhk
        NEXT_PUBLIC_TENANT_LOCKED: "true"
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
