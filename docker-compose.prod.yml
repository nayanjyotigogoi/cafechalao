# Production website for https://tohfaah.com. It joins the "cafechalao" network made by the backend
# repository (CC-BEND), whose Caddy proxy gives it HTTPS. Start the backend first, then:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_MODE: http
        NEXT_PUBLIC_API_URL: https://tohfaah.online
        NEXT_PUBLIC_DEFAULT_TENANT: cafe-1bhk
        NEXT_PUBLIC_TENANT_LOCKED: "true"
    restart: unless-stopped

networks:
  default:
    name: cafechalao
    external: true
